name: Build Windows Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, exemplo: v0.4.0. Precisa ser igual a package.json version."
        required: true
        default: "v0.4.0"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm build:win:ci

      - name: Require in-app update metadata
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ("v$($pkg.version)" -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG does not match package.json version $($pkg.version). electron-updater compares latest.yml, which is built from package.json."
          }
          if (-not (Test-Path dist/latest.yml)) { throw "dist/latest.yml is missing. Installed clients cannot see this release." }
          if (-not (Test-Path "dist/Aetherion.Launcher.Setup.$($pkg.version).exe")) { throw "Installer name does not match package.json." }
          if (-not (Test-Path "dist/Aetherion.Launcher.Setup.$($pkg.version).exe.blockmap")) { throw "The installer blockmap is missing." }
          node scripts/validate-latest-yml.mjs dist/latest.yml $pkg.version

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Aetherion Launcher ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/latest.yml
            dist/Aetherion.Launcher.Setup.*.exe
            dist/Aetherion.Launcher.Setup.*.exe.blockmap
          fail_on_unmatched_files: true
